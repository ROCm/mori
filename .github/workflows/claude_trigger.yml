name: Claude Review Trigger

# Request a Claude review of a PR: comment "/claude-review" on the PR, or add
# the "claude-review" label. Either way this dispatches claude_auto_review.yml.
#
# The review does not run on these events directly. claude-code-action gets
# its claude[bot] token by exchanging the job's GitHub OIDC token, and the
# exchange rejects the subject that PR events carry (repo:ROCm/mori:pull_request)
# but accepts the ref-based subject of a repository_dispatch run. The review
# has to post as claude[bot], because update-pr-review finds the earlier review
# threads by that login. A GITHUB_TOKEN may send repository_dispatch, and that
# event starts workflows even when GITHUB_TOKEN sent it.
#
# Fork PRs: use the comment. A label event on a fork PR gets a read-only
# GITHUB_TOKEN, which cannot send the dispatch, so the label path skips them.
# (pull_request_target would have a write token, but GitHub's default policy
# blocks it in public repositories from 2026-12-02.)
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: write  # repository_dispatch
  issues: write
  pull-requests: write

jobs:
  dispatch:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/claude-review')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-review' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const reply = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number: number, body })
                .catch((e) => core.warning(`could not comment: ${e.message}`));
            // claude_auto_review.yml removes the label when the review ends, so
            // it can be added again. Remove it here only when no review starts.
            const dropLabel = async () => {
              const labels = (context.payload.issue || context.payload.pull_request).labels || [];
              if (labels.some((l) => l.name === 'claude-review')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'claude-review' })
                  .catch((e) => core.warning(`could not remove claude-review: ${e.message}`));
              }
            };

            // A review spends LLM gateway quota and a self-hosted runner, so
            // require write access. author_association is not enough: MEMBER is
            // any org member.
            let permission = 'none';
            try {
              ({ data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: context.actor }));
            } catch (e) {}
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              await dropLabel();
              await reply(`A Claude review needs write access to ${owner}/${repo}; @${context.actor} has \`${permission}\`.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open') {
              await dropLabel();
              await reply('`/claude-review`: this PR is not open.');
              return;
            }
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: context.payload.comment.id, content: 'eyes',
              }).catch(() => {});
            }

            await github.rest.repos.createDispatchEvent({
              owner, repo, event_type: 'claude-review', client_payload: { pull_number: number },
            });
