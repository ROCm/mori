name: Claude Auto Review

on:
  # Triggered by claude_trigger.yml via repository_dispatch.
  # Expected client_payload schema:
  #   pull_number: number
  repository_dispatch:
    types: [claude-review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

# Two reviews of one PR running at once would both post the same findings.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pull_number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # The LLM gateway behind ANTHROPIC_BASE_URL resolves only on the internal
    # network, so GitHub-hosted runners cannot reach it. build-only-mori is a
    # CPU-only pool like ROCm/xla's build-only-xla.
    runs-on: build-only-mori
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required by claude-code-action for OIDC auth.
    steps:
      # Without git, actions/checkout falls back to a tarball with no .git; the
      # setup-bun step inside claude-code-action extracts with unzip; the review
      # itself runs gh and jq. Name what is missing instead of failing later.
      - name: Check runner tools
        run: |
          missing=""
          for t in git gh jq curl unzip; do command -v "$t" >/dev/null || missing="$missing $t"; done
          if [ -n "$missing" ]; then
            echo "::error::runner $RUNNER_NAME is missing:$missing"
            exit 1
          fi

      # refs/pull/<number>/head is a GitHub-managed ref that always exists in the base
      # repo for every PR, including those from forks. Using the branch name would fail
      # for fork PRs since the branch lives in the fork, not here.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.client_payload.pull_number || inputs.pr_number }}/head

      # The PR branch may not have the .claude/ directory (skills, settings) since it
      # only lives on the default branch. Overlay it so Claude Code can find the skill.
      - name: Fetch .claude config from default branch
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          git restore --source=origin/${{ github.event.repository.default_branch }} --worktree -- .claude
          find .claude -type f | sort

      # claude-code-action auto-configures the GitHub inline comment MCP server only
      # when triggered by pull_request or pull_request_target events, where it can
      # infer the PR number from the event context. When triggered by repository_dispatch
      # or workflow_dispatch, there is no PR event context, so the action cannot set up
      # the MCP server automatically. We create the config manually, passing the PR number
      # from the dispatch payload so the inline comment tool knows which PR to annotate.
      #
      # CLASSIFY_INLINE_COMMENTS=false makes the server post each comment when it is
      # called. Otherwise it buffers comments for the action's post step, which reads the
      # PR number from the pull_request or issue event and so, under repository_dispatch,
      # drops every buffered comment with only a warning. The `v1` in the server path is
      # the ref of `anthropics/claude-code-action@v1` below.
      - name: Create MCP config
        id: mcp
        run: |
          server="$(dirname "$RUNNER_WORKSPACE")/_actions/anthropics/claude-code-action/v1/src/mcp/github-inline-comment-server.ts"
          if [ ! -f "$server" ]; then
            echo "::error::inline comment MCP server not found at $server"
            exit 1
          fi
          config="$RUNNER_TEMP/mcp-config.json"
          cat > "$config" << EOF
          {
            "mcpServers": {
              "github_inline_comment": {
                "command": "bun",
                "args": ["run", "$server"],
                "env": {
                  "REPO_OWNER": "${{ github.repository_owner }}",
                  "REPO_NAME": "${{ github.event.repository.name }}",
                  "PR_NUMBER": "${{ github.event.client_payload.pull_number || inputs.pr_number }}",
                  "GITHUB_API_URL": "${{ github.api_url }}",
                  "CLASSIFY_INLINE_COMMENTS": "false"
                }
              }
            }
          }
          EOF
          echo "file=$config" >> "$GITHUB_OUTPUT"

      - name: Review Pull Request
        id: claude-code
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: |
            Ocp-Apim-Subscription-Key: ${{ secrets.LLM_GATEWAY_KEY }}
            user: ${{ secrets.USER_NTID }}
          ANTHROPIC_MODEL: "Claude-Opus-5.5"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "Claude-Opus-5.5"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "Claude-Sonnet-4.6"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "Claude-Haiku-4.5"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: "sk-ant-dummy-gateway-key"
          # When triggered via repository_dispatch, the actor is github-actions[bot],
          # not a human. Without this, claude-code-action rejects the run.
          allowed_bots: "github-actions[bot]"
          classify_inline_comments: "false"
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.client_payload.pull_number || inputs.pr_number }}

            Note: The PR branch is already checked out in the current working directory.

            ## Step 1 — Check for previous Claude review comments
            Run this command to determine whether previous Claude inline comments exist on this PR:
            ```
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.client_payload.pull_number || inputs.pr_number }}/comments" | jq -s 'add // [] | [.[] | select(.user.login == "claude[bot]" and .in_reply_to_id == null)] | length'
            ```

            ## Step 2 — Fresh Review
            Run the /review-mori-pr skill with only the PR number as the argument
            (e.g. /review-mori-pr 640). This produces a fresh set of findings from the diff.
            Do NOT post anything to GitHub yet.

            ## Step 3 — Post Results

            **If Step 1 returned 0 (no previous Claude comments — initial review):**
            Post all findings directly:
            - Use `mcp__github_inline_comment__create_inline_comment` to post each finding
              inline on the relevant diff lines.

            **If Step 1 returned > 0 (previous Claude comments exist — re-review):**
            Run the /update-pr-review skill with only the PR number as the argument
            (e.g. /update-pr-review 640), passing the findings from Step 2 as context.
            This skill handles thread-aware updates (resolved replies, follow-up replies) and
            returns only genuinely new findings. Then use
            `mcp__github_inline_comment__create_inline_comment` to post those new findings only.
            Do NOT post inline comments for findings already handled as thread updates.

            **Always (both cases):**
            - Use `gh pr comment` to post ONLY a short top-level summary. Do NOT repeat
              individual findings in the top-level comment — those belong inline.
            - Do NOT post intermediate analysis steps or thinking-out-loud to the PR.
            - Only post GitHub comments — do not submit review text as messages.
            - NEVER post the same issue twice as a new inline comment.
          claude_args: |
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh *),Bash(git *),Bash(jq *),Bash(head *),Bash(grep *),Read,Grep,Glob" --mcp-config ${{ steps.mcp.outputs.file }}
          settings: |
            {
              "hasCompletedOnboarding": true
            }

      - name: Upload Claude Execution Log
        if: always() && steps.claude-code.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log
          path: ${{ steps.claude-code.outputs.execution_file }}

      - name: Remove claude-review label
        if: always() && github.event.client_payload.pull_number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "/repos/${{ github.repository }}/issues/${{ github.event.client_payload.pull_number }}/labels/claude-review" \
            || true
