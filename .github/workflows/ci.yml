# Perf-collection-only CI for feat/ep-v1-atomic-free-ionic-dmabuf. NOT FOR MERGE.
#
# Runs the MORI-EP internode bench on the 2-node MI355X AINIC pair for:
#   MORI_EP_DISABLE_RDMA_ATOMICS = 0, 1
#   MORI_ENABLE_RAIL_ONLY        = 1
#   MORI_ENABLE_DMABUF_REG       = 0 (no dma-buf registration)
# over kernel v1/v1_ll and max-tokens 64..4096, with the same bench arguments as
# the upstream "MORI-EP internode normal kernel bench" step so numbers compare.
name: MoRI EP perf (atomic-free, rail-only, no dma-buf)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: rocm/mori:ci
  BASE_IMAGE: rocm/pytorch:rocm7.14_ubuntu24.04_py3.12_pytorch_release_2.12.0
  CONTAINER: mori_ci_${{ github.run_id }}

jobs:
  ep-perf:
    name: mori EP internode perf (MI355X_AINIC)
    runs-on: [self-hosted, MI355X-AINIC]
    env:
      CT: podman
      # node2's sshd checks every new connection against the Conductor auth
      # service, which intermittently answers 503 and denies the login (ssh exits
      # 255). Multiplex all of a job's ssh/rsync calls over one master connection
      # so only the first one is checked; "Open SSH connection to node2" retries it.
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPath=/tmp/mori-ci-ssh-%C -o ControlPersist=30m
      NODE1_HOST: 10.2.80.20
      NODE2_HOST: 10.2.80.10
      NODE2_PORT: 22
      NODE1_IFNAME: enp193s0f1np1
      NODE2_IFNAME: enp193s0f1np1
      MORI_RDMA_DEVICES: rocep105s0,rocep121s0,rocep137s0,rocep153s0,rocep233s0,rocep249s0,rocep25s0,rocep9s0
      MORI_RDMA_SL: 3
      MORI_RDMA_TC: 104
      MORI_SOCKET_IFNAME: enp193s0f1np1
      LOG_DIR: ${{ github.workspace }}/ep_perf_logs
    timeout-minutes: 90
    steps:
      - name: Fix workspace permissions
        run: |
          WS="${GITHUB_WORKSPACE}"
          if [ -d "$WS" ]; then
            $CT run --rm -v "$WS:$WS" "$BASE_IMAGE" \
              chown -R $(id -u):$(id -g) "$WS" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event_name == 'pull_request' && github.run_attempt > 1 && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - name: Build CI image
        run: |
          build() {
            $CT build --network=host --build-arg BASE_IMAGE=$BASE_IMAGE -t $IMAGE -f docker/Dockerfile.dev .
          }
          build && exit 0
          # 'system migrate' stops every container owned by this user, not just
          # this job's, so keep it on the failure path only.
          echo "::warning::podman build failed; retrying after 'system migrate'"
          podman ps --format 'will be stopped: {{.Names}}' || true
          podman system migrate || true
          build

      - name: Start container on node1
        run: |
          $CT rm -f $CONTAINER 2>/dev/null || true
          CONTAINER_RUNTIME=$CT ./docker/ci_run.sh --name $CONTAINER \
            -e MORI_RDMA_DEVICES=$MORI_RDMA_DEVICES \
            -e MORI_RDMA_SL=$MORI_RDMA_SL \
            -e MORI_RDMA_TC=$MORI_RDMA_TC \
            -e MORI_SOCKET_IFNAME=$MORI_SOCKET_IFNAME \
            -e GLOO_SOCKET_IFNAME=$NODE1_IFNAME \
            -e NCCL_SOCKET_IFNAME=$NODE1_IFNAME \
            -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
            -w $GITHUB_WORKSPACE \
            $IMAGE sleep infinity
          $CT exec $CONTAINER \
            git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Open SSH connection to node2
        run: |
          for i in 1 2 3 4 5; do
            ssh $SSH_OPTS -p $NODE2_PORT $(whoami)@$NODE2_HOST true && exit 0
            echo "ssh to node2 failed (attempt $i/5), retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Start container on node2
        run: |
          # node2 gets no checkout, so nothing there resets ownership; the previous
          # job leaves root-owned build output that would make rsync fail on EPERM.
          ssh $SSH_OPTS -p $NODE2_PORT $(whoami)@$NODE2_HOST "
            $CT rm -f $CONTAINER 2>/dev/null || true
            mkdir -p $GITHUB_WORKSPACE
            $CT run --rm -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE $BASE_IMAGE \
              chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE 2>/dev/null || true
          "
          rsync -az --exclude='.git' \
            -e "ssh $SSH_OPTS -p $NODE2_PORT" \
            $GITHUB_WORKSPACE/ \
            $(whoami)@$NODE2_HOST:$GITHUB_WORKSPACE/
          ssh $SSH_OPTS -p $NODE2_PORT $(whoami)@$NODE2_HOST "
            cd $GITHUB_WORKSPACE &&
            $CT build --network=host --build-arg BASE_IMAGE=$BASE_IMAGE -t $IMAGE -f docker/Dockerfile.dev . &&
            CONTAINER_RUNTIME=$CT ./docker/ci_run.sh --name $CONTAINER \
              -e MORI_RDMA_DEVICES=$MORI_RDMA_DEVICES \
              -e MORI_RDMA_SL=$MORI_RDMA_SL \
              -e MORI_RDMA_TC=$MORI_RDMA_TC \
              -e MORI_SOCKET_IFNAME=$MORI_SOCKET_IFNAME \
              -e GLOO_SOCKET_IFNAME=$NODE2_IFNAME \
              -e NCCL_SOCKET_IFNAME=$NODE2_IFNAME \
              -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
              -w $GITHUB_WORKSPACE \
              $IMAGE sleep infinity &&
            $CT exec $CONTAINER \
              git config --global --add safe.directory $GITHUB_WORKSPACE
          "

      - name: Install mori (node1)
        run: |
          $CT exec $CONTAINER bash -c \
            "cd $GITHUB_WORKSPACE && BUILD_EXAMPLES=ON pip install . && pip install prettytable && (command -v numactl >/dev/null || (apt-get update && apt-get install -y numactl))"

      - name: Install mori (node2)
        run: |
          ssh $SSH_OPTS -p $NODE2_PORT $(whoami)@$NODE2_HOST \
            "$CT exec $CONTAINER bash -c 'cd $GITHUB_WORKSPACE && BUILD_EXAMPLES=ON pip install . && pip install prettytable && (command -v numactl >/dev/null || (apt-get update && apt-get install -y numactl))'"

      - name: MORI-EP internode bench (atomic-free 0/1, rail-only, no dma-buf)
        run: |
          SCRIPT="$GITHUB_WORKSPACE/tools/run_internode_test.sh"
          mkdir -p "$LOG_DIR"
          PORT=29140
          for ATOMIC_FREE in 0 1; do
            RUN_ENV="-e MORI_INTERNODE_TIMEOUT=600 -e MORI_ENABLE_RAIL_ONLY=1 -e MORI_ENABLE_DMABUF_REG=0"
            RUN_ENV="$RUN_ENV -e MORI_EP_DISABLE_RDMA_ATOMICS=$ATOMIC_FREE"
            RUN_ENV="$RUN_ENV -e MORI_APP_LOG_LEVEL=INFO -e MORI_OPS_LOG_LEVEL=INFO"
            for KERNEL in v1 v1_ll; do
              for TOKENS in 64 128 1024 2048 4096; do
                TAG="atomicfree${ATOMIC_FREE}_railonly1_dmabuf0_${KERNEL}_tok${TOKENS}"
                LOG="$LOG_DIR/$TAG.log"
                echo "=== bench $TAG port=$PORT ==="
                NODE2_CMD=(
                  $CT exec $RUN_ENV $CONTAINER bash $SCRIPT
                  --rank 1 --master-addr $NODE1_HOST --master-port $PORT
                  --ifname $NODE2_IFNAME
                  --cmd bench --kernel-type $KERNEL --max-tokens $TOKENS
                )
                ssh $SSH_OPTS -p $NODE2_PORT $(whoami)@$NODE2_HOST "${NODE2_CMD[*]}" \
                  > "$LOG_DIR/$TAG.node2.log" 2>&1 &
                NODE2_PID=$!
                set +e
                $CT exec $RUN_ENV $CONTAINER bash $SCRIPT \
                  --rank 0 --master-addr $NODE1_HOST --master-port $PORT \
                  --ifname $NODE1_IFNAME \
                  --cmd bench --kernel-type $KERNEL --max-tokens $TOKENS 2>&1 | tee "$LOG"
                rc=${PIPESTATUS[0]}
                wait $NODE2_PID
                rc2=$?
                set -e
                if [ $rc -ne 0 ] || [ $rc2 -ne 0 ]; then
                  echo "::error::$TAG failed (node1 rc=$rc, node2 rc=$rc2)"
                  tail -50 "$LOG_DIR/$TAG.node2.log"
                  exit 1
                fi
                # Every local rank must have connected to exactly one cross-node peer.
                n=$(grep -c "rail-only: rank .* connected 1 RDMA peers" "$LOG" || true)
                [ "$n" -eq 8 ] || { echo "::error::$TAG: expected 8 rail-only ranks, got $n"; exit 1; }
                if grep -q "MORI_EP_DISABLE_RDMA_ATOMICS is set" "$LOG"; then af_seen=1; else af_seen=0; fi
                [ "$af_seen" -eq "$ATOMIC_FREE" ] || { echo "::error::$TAG: atomic-free log mismatch (seen=$af_seen)"; exit 1; }
                sleep 1
                PORT=$((PORT + 1))
              done
            done
          done

      - name: Upload EP perf logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep-perf-atomicfree-railonly-nodmabuf-${{ github.run_id }}
          path: ${{ github.workspace }}/ep_perf_logs
          if-no-files-found: warn

      - name: Cleanup node1
        if: always()
        run: |
          $CT rm -f $CONTAINER || true
          if $CT image inspect $IMAGE &>/dev/null; then
            $CT run --rm -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE $IMAGE \
                chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE 2>/dev/null || true
          fi

      - name: Cleanup node2
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -p $NODE2_PORT $(whoami)@$NODE2_HOST \
            "$CT rm -f $CONTAINER || true"
