name: MoRI collectives benchmark CI
on:
  push:
    branches: [main, pemeliya/rs-push-slice-timing-41bf]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: rocm/mori:ci
  BASE_IMAGE: rocm/pytorch:rocm7.14_ubuntu24.04_py3.12_pytorch_release_2.12.0
  CONTAINER: mori_ci_${{ github.run_id }}
  CT: docker
  BENCH: tools/ci/run_collective_bench.sh
  LOG_DIR: ci-logs/collective-bench
  EXTRA_SIZES: "777777"
  # Small / odd / non-divisible edge sizes for the variable-shard + idle-PE paths.
  # All-reduce re-splits the buffer into its own 16B-aligned shards, so it takes
  # any count: tiny sizes (fewer shards than PEs) fall back to pull, odd/non-
  # divisible sizes get a shorter last shard. Reduce-scatter inherits the caller's
  # shard layout, so bf16/f16 need an even per-shard base (count % npes == 0 and
  # count/npes even) -- its edges stay multiples of 16. AG/A2A/CP just move bytes.
  AR_EDGE_SIZES: "1 2 7 31 100 999 4099"
  RS_EDGE_SIZES: "16 48 1008 4080"
  EDGE_SIZES: "48 4080"
  # Message-size growth factor between benchmark runs (num/den).
  SIZE_STEP: "3/2"
  # The RS push timing branch runs only its own step, not the regular matrix.
  TIMING_ONLY: ${{ github.ref == 'refs/heads/pemeliya/rs-push-slice-timing-41bf' || github.head_ref == 'pemeliya/rs-push-slice-timing-41bf' }}

jobs:
  collective-bench:
    name: collectives benchmark (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: MI355X_AINIC
            runner: [self-hosted, MI355X-AINIC-PIT-G17]
          - platform: MI300X_MLX
            runner: [self-hosted, 300_mlx_p19_29]
    timeout-minutes: 180
    steps:
      - name: Fix workspace permissions
        run: |
          # Docker pip runs as root; stale root-owned files break actions/checkout cleanup.
          WS="${GITHUB_WORKSPACE}"
          if [ -d "$WS" ]; then
            $CT run --rm -v "$WS:$WS" "$BASE_IMAGE" \
              chown -R $(id -u):$(id -g) "$WS" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # A re-run (run_attempt > 1) checks out the PR merged with the current
          # main; otherwise it would reuse the merge commit of the first attempt.
          ref: ${{ github.event_name == 'pull_request' && github.run_attempt > 1 && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - name: Build CI image
        run: $CT build --network=host --build-arg BASE_IMAGE=$BASE_IMAGE -t $IMAGE -f docker/Dockerfile.dev .

      - name: Start container
        run: |
          $CT rm -f $CONTAINER 2>/dev/null || true
          CONTAINER_RUNTIME=$CT ./docker/ci_run.sh --name $CONTAINER \
            -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
            -w $GITHUB_WORKSPACE \
            $IMAGE sleep infinity
          $CT exec $CONTAINER \
            git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Build mori + collectives_benchmark
        id: build
        run: |
          $CT exec $CONTAINER bash -c "MORI_RS_PUSH_TIMING_BENCH=1 BUILD_CCO_SDMA=ON BUILD_EXAMPLES=ON pip install ."
          $CT exec $CONTAINER test -x build/examples/collectives_benchmark
          $CT exec $CONTAINER test -x build/examples/collectives_benchmark_rs_timing
          rm -rf $LOG_DIR

      # Temporary (RS push slice timing investigation): reduce-scatter push only,
      # at large sizes, sweeping the grid cap (MORI_CCL_MAX_NBLOCKS, 0 = full grid)
      # to find how few CUs still hide the per-slice reduce behind the SDMA
      # copies. Each point runs once with the normal binary (kernel time) and
      # once with RS_PUSH_TIMING compiled in (per-slice wait/reduce tables in the
      # job summary; raw [RS-T] lines in the uploaded logs).
      - name: reduce_scatter push grid sweep (nblocks 16-full; S=1,4,8; 64M-1G)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY == 'true' }}
        run: |
          fail=0
          for nb in 16 32 64 128 0; do
            for logS in 0 2 3; do
              for bin in collectives_benchmark collectives_benchmark_rs_timing; do
                label="nb${nb} "
                [ "$bin" = collectives_benchmark_rs_timing ] && label="timing nb${nb} "
                $CT exec -e DTYPES="bf16" -e OPS=sum \
                  -e SIZES="67108864 268435456 1073741824" \
                  -e MORI_CCL_MAX_NBLOCKS=$nb \
                  -e RUN_TIMEOUT=180 -e BIN=./build/examples/$bin -e LABEL="$label" \
                  $CONTAINER bash $BENCH --coll reduce_scatter --mode push --logS $logS || fail=1
              done
            done
          done
          exit $fail

      # Each group runs even if an earlier one failed, so one broken kernel does
      # not hide the state of the others. Default push coverage is S = 4
      # (logS = 2) over f32/bf16/f16, sum/prod, 1M-128M plus EXTRA_SIZES.
      - name: reduce_scatter push (S=4)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: $CT exec -e SIZE_STEP -e EXTRA_SIZES="$EXTRA_SIZES $RS_EDGE_SIZES" $CONTAINER bash $BENCH --coll reduce_scatter --mode push --logS 2

      - name: reduce_scatter pull
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: $CT exec -e SIZE_STEP -e EXTRA_SIZES="$EXTRA_SIZES $RS_EDGE_SIZES" $CONTAINER bash $BENCH --coll reduce_scatter --mode pull

      - name: all_reduce push (S=4)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: $CT exec -e SIZE_STEP -e EXTRA_SIZES="$EXTRA_SIZES $AR_EDGE_SIZES" $CONTAINER bash $BENCH --coll all_reduce --mode push --logS 2

      - name: all_reduce pull
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: $CT exec -e SIZE_STEP -e EXTRA_SIZES="$EXTRA_SIZES $AR_EDGE_SIZES" $CONTAINER bash $BENCH --coll all_reduce --mode pull

      # Extra push coverage: S = 1,2,4,8 (logS 0..3), bf16/f32 sum, 16M-512M elems.
      - name: reduce_scatter push (S=1,2,4,8; 16M-1G)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: |
          fail=0
          for logS in 0 1 2 3; do
            $CT exec -e SIZE_STEP -e DTYPES="bf16" -e OPS=sum \
              -e MIN_SIZE=16777216 -e MAX_SIZE=1073741824 \
              -e RUN_TIMEOUT=180 \
              $CONTAINER bash $BENCH --coll reduce_scatter --mode push --logS $logS || fail=1
          done
          exit $fail

      - name: all_reduce push (S=1,2,4,8; 16M-1G)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: |
          fail=0
          for logS in 0 1 2 3; do
            $CT exec -e SIZE_STEP -e DTYPES="bf16" -e OPS=sum \
              -e MIN_SIZE=16777216 -e MAX_SIZE=1073741824 \
              -e RUN_TIMEOUT=180 \
              $CONTAINER bash $BENCH --coll all_reduce --mode push --logS $logS || fail=1
          done
          exit $fail

      - name: all_gather
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: $CT exec -e SIZE_STEP -e DTYPES=bf16 -e EXTRA_SIZES="$EXTRA_SIZES $EDGE_SIZES" $CONTAINER bash $BENCH --coll all_gather

      - name: all_to_all
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: $CT exec -e SIZE_STEP -e DTYPES=bf16 -e EXTRA_SIZES="$EXTRA_SIZES $EDGE_SIZES" $CONTAINER bash $BENCH --coll all_to_all

      - name: collective_permute
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.TIMING_ONLY != 'true' }}
        run: $CT exec -e SIZE_STEP -e DTYPES=bf16 -e EXTRA_SIZES="$EXTRA_SIZES $EDGE_SIZES" $CONTAINER bash $BENCH --coll collective_permute

      - name: Publish summary
        if: always()
        run: |
          if [ -f $LOG_DIR/summary.md ]; then
            echo "## ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
            cat $LOG_DIR/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-bench-logs-${{ matrix.platform }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          $CT rm -f $CONTAINER || true
          $CT run --rm -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE $BASE_IMAGE \
              chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE 2>/dev/null || true
