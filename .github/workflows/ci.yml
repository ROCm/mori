name: MoRI collectives benchmark CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: rocm/mori:ci
  BASE_IMAGE: rocm/pytorch:rocm7.14_ubuntu24.04_py3.12_pytorch_release_2.12.0
  CONTAINER: mori_ci_${{ github.run_id }}
  CT: docker
  BENCH: tools/ci/run_collective_bench.sh
  LOG_DIR: ci-logs/collective-bench
  EXTRA_SIZES: "77776 9999984"

jobs:
  collective-bench:
    name: collectives benchmark (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: MI355X_AINIC
            runner: [self-hosted, MI355X-AINIC-PIT-G17]
          - platform: MI300X_MLX
            runner: [self-hosted, 300_mlx_p19_29]
    timeout-minutes: 90
    steps:
      - name: Fix workspace permissions
        run: |
          # Docker pip runs as root; stale root-owned files break actions/checkout cleanup.
          WS="${GITHUB_WORKSPACE}"
          if [ -d "$WS" ]; then
            $CT run --rm -v "$WS:$WS" "$BASE_IMAGE" \
              chown -R $(id -u):$(id -g) "$WS" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build CI image
        run: $CT build --network=host --build-arg BASE_IMAGE=$BASE_IMAGE -t $IMAGE -f docker/Dockerfile.dev .

      - name: Start container
        run: |
          $CT rm -f $CONTAINER 2>/dev/null || true
          CONTAINER_RUNTIME=$CT ./docker/ci_run.sh --name $CONTAINER \
            -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
            -w $GITHUB_WORKSPACE \
            $IMAGE sleep infinity
          $CT exec $CONTAINER \
            git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Build mori + collectives_benchmark
        id: build
        run: |
          $CT exec $CONTAINER bash -c "BUILD_CCO_SDMA=ON BUILD_EXAMPLES=ON pip install ."
          $CT exec $CONTAINER test -x build/examples/collectives_benchmark
          rm -rf $LOG_DIR

      # Each group runs even if an earlier one failed, so one broken kernel does
      # not hide the state of the others. Push runs use S = 1 << logS = 4 slices.
      - name: reduce_scatter push (S=4)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: $CT exec -e EXTRA_SIZES="$EXTRA_SIZES" $CONTAINER bash $BENCH --coll reduce_scatter --mode push --logS 2

      - name: reduce_scatter pull
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: $CT exec -e EXTRA_SIZES="$EXTRA_SIZES" $CONTAINER bash $BENCH --coll reduce_scatter --mode pull

      - name: all_reduce push (S=4)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: $CT exec -e EXTRA_SIZES="$EXTRA_SIZES" $CONTAINER bash $BENCH --coll all_reduce --mode push --logS 2

      - name: all_reduce pull
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: $CT exec -e EXTRA_SIZES="$EXTRA_SIZES" $CONTAINER bash $BENCH --coll all_reduce --mode pull

      - name: all_gather
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: $CT exec -e DTYPES=bf16 -e EXTRA_SIZES="$EXTRA_SIZES" $CONTAINER bash $BENCH --coll all_gather

      - name: all_to_all
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: $CT exec -e DTYPES=bf16 -e EXTRA_SIZES="$EXTRA_SIZES" $CONTAINER bash $BENCH --coll all_to_all

      - name: collective_permute
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: $CT exec -e DTYPES=bf16 -e EXTRA_SIZES="$EXTRA_SIZES" $CONTAINER bash $BENCH --coll collective_permute

      - name: Publish summary
        if: always()
        run: |
          if [ -f $LOG_DIR/summary.md ]; then
            echo "## ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
            cat $LOG_DIR/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-bench-logs-${{ matrix.platform }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          $CT rm -f $CONTAINER || true
          $CT run --rm -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE $BASE_IMAGE \
              chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE 2>/dev/null || true
