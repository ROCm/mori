# TEST STUB for the ci-rerun fork test (do not merge): stands in for the real
# ci.yml on GitHub-hosted runners so no GPU runner is used.
name: MoRI CI test
on:
  pull_request:
    branches: [jhchouuu/ci-rerun-fork-test-base]
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.run_attempt > 1 && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
      - name: Report
        run: |
          echo "attempt=${{ github.run_attempt }} event_sha=${{ github.sha }} checked_out=$(git rev-parse HEAD)"
          git log -1 --format='%s'
          sleep 120
