name: xgmi-netmon

# tools/xgmi_netmon is not part of the top-level CMake build, so no other workflow compiles it or
# runs its unit tests. The tests need no GPU: gpu_metrics captures are in tests/fixtures.
on:
  pull_request:
    branches: [main]
    paths:
      - tools/xgmi_netmon/**
      - .github/workflows/xgmi-netmon.yml
  push:
    branches: [main]
    paths:
      - tools/xgmi_netmon/**
      - .github/workflows/xgmi-netmon.yml

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S tools/xgmi_netmon -B build-xgmi -DCMAKE_BUILD_TYPE=Release
          cmake --build build-xgmi -j
      - name: Test
        run: ctest --test-dir build-xgmi --output-on-failure --no-tests=error
