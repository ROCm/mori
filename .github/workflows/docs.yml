name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - docs-website
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt pytest

      # Publication is gated on the link checker, so test the checker itself
      # first: one that passed everything would keep this job green while the
      # site rotted. Hand-written HTML fixtures, no Sphinx and no network.
      - name: Test the link checker
        run: python -m pytest tests/python/test_check_docs_links.py -q

      # The reference pages are source documents; do not compile MORI or install
      # a CPU PyTorch wheel just to render them on this non-GPU runner.
      # -E matches the command this configuration was validated with; the runner
      # has no cache, so it only removes a difference, it does not add work.
      - name: Build Sphinx documentation
        run: python -m sphinx -E -n -W --keep-going -b html docs docs/_build/html

      - name: Check rendered local links
        run: python tools/check_docs_links.py docs/_build/html

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 7

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs-website')

    permissions:
      contents: write

    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: ./html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html
          keep_files: true
          commit_message: 'docs: deploy documentation'
