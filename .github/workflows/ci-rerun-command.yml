name: ci-rerun command

# Comment "/ci-rerun" on a PR to re-run CI on the PR merged with the current
# main. This only adds the "ci-rerun" label; ci.yml and ci_cco.yml react to it.
#
# The label is added with secrets.MORI_BOT_TOKEN (a PAT or GitHub App token
# with Issues and Pull requests write access). It cannot be GITHUB_TOKEN:
# events caused by GITHUB_TOKEN never start new workflow runs, so a label added
# with it would trigger nothing.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  add-ci-rerun-label:
    # Only people with write access: this starts CI on the self-hosted GPU runners.
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ci-rerun') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Check the bot token is configured
        env:
          MORI_BOT_TOKEN: ${{ secrets.MORI_BOT_TOKEN }}
        run: |
          if [ -z "$MORI_BOT_TOKEN" ]; then
            echo "::error::secrets.MORI_BOT_TOKEN is not set; add the ci-rerun label by hand instead."
            exit 1
          fi

      - name: Add the ci-rerun label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MORI_BOT_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            }).catch(() => {});
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ci-rerun'],
            });
