name: ci-rerun

# Re-run CI on a PR merged with the current main, without pushing to the PR
# branch: comment "/ci-rerun" on the PR, or add the "ci-rerun" label.
#
# This starts ci.yml and ci_cco.yml with workflow_dispatch on the PR branch and
# merge_main=true, so they merge the current main in after checkout. Their
# results land on the PR head commit and show up in the PR checks.
# GITHUB_TOKEN may start workflow_dispatch runs (labels or pushes made with it
# start nothing), so no personal token is involved. Fork PRs are not
# supported: workflow_dispatch can only target branches of this repository.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  rerun:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/ci-rerun')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ci-rerun')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const reply = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number: number, body })
                .catch((e) => core.warning(`could not comment: ${e.message}`));

            // Remove the label first so it can be added again next time.
            if (context.eventName === 'pull_request') {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'ci-rerun' })
                .catch((e) => core.warning(`could not remove ci-rerun: ${e.message}`));
            }

            // This starts CI on the self-hosted GPU runners, so require write
            // access. author_association is not enough: MEMBER is any org member.
            let permission = 'none';
            try {
              ({ data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: context.actor }));
            } catch (e) {}
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              await reply(`\`/ci-rerun\` needs write access to ${owner}/${repo}; @${context.actor} has \`${permission}\`.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open') {
              await reply('`/ci-rerun`: this PR is not open.');
              return;
            }
            if (pr.head.repo === null || pr.head.repo.full_name !== `${owner}/${repo}`) {
              await reply('`/ci-rerun` only works for PRs from branches of this repository; push a commit to re-run CI on a fork PR.');
              return;
            }

            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: context.payload.comment.id, content: 'rocket',
              }).catch(() => {});
            }

            // Branches that predate merge_main reject the input (422); run them as they are.
            let how = 'merged with the current main';
            for (const workflow_id of ['ci.yml', 'ci_cco.yml']) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id, ref: pr.head.ref, inputs: { merge_main: 'true' } });
              } catch (e) {
                if (e.status !== 422) throw e;
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: pr.head.ref });
                how = 'as it is, without merging main (this branch predates the ci-rerun support; merge main into it to get that)';
              }
            }
            const runs = `https://github.com/${owner}/${repo}/actions?query=${encodeURIComponent(`event:workflow_dispatch branch:${pr.head.ref}`)}`;
            await reply(`Re-running CI on \`${pr.head.ref}\` ${how}: [runs](${runs}).`);
