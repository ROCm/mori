<svg viewBox="0 0 1160 520" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="A batch of twelve keys is assigned to four drives under one short lock, then all four drives write in parallel, finishing in about a quarter of the time one drive would take.">
  <title>Multi-drive fan-out: one batch, four drives, one short lock</title>
  <defs>
    <pattern id="grid01" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#c3d0ce" stroke-width="1"/>
    </pattern>
    <marker id="arrInk01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16232a"/>
    </marker>
    <marker id="arrBlue01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2569a6"/>
    </marker>
  </defs>
  <rect width="1160" height="520" fill="#e8edec"/>
  <rect width="1160" height="520" fill="url(#grid01)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="1159" height="519" fill="none" stroke="#16232a" stroke-opacity="0.25"/>

  <text x="580" y="34" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#16232a">WRITE BATCH — 12 KEYS, ONE CALL</text>

  <rect x="416" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="442" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="468" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="494" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="520" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="546" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="572" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="598" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="624" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="650" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="676" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>
  <rect x="702" y="52" width="18" height="18" fill="#cc7a1f" stroke="#16232a"/>

  <line x1="580" y1="76" x2="580" y2="120" stroke="#16232a" stroke-width="2" marker-end="url(#arrInk01)"/>
  <polygon points="580,120 566,146 594,146" fill="none" stroke="#16232a" stroke-width="1.5"/>
  <text x="580" y="168" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#55696c">assign + reserve space</text>
  <text x="580" y="182" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#55696c">under one short lock</text>

  <line x1="580" y1="146" x2="140" y2="230" stroke="#2569a6" stroke-width="1.75" marker-end="url(#arrBlue01)"/>
  <line x1="580" y1="146" x2="420" y2="230" stroke="#2569a6" stroke-width="1.75" marker-end="url(#arrBlue01)"/>
  <line x1="580" y1="146" x2="700" y2="230" stroke="#2569a6" stroke-width="1.75" marker-end="url(#arrBlue01)"/>
  <line x1="580" y1="146" x2="980" y2="230" stroke="#2569a6" stroke-width="1.75" marker-end="url(#arrBlue01)"/>
  <text x="330" y="200" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#2569a6">3 keys</text>
  <text x="460" y="215" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#2569a6">3 keys</text>
  <text x="700" y="200" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#2569a6">4 keys</text>
  <text x="850" y="215" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#2569a6">2 keys</text>

  <g font-family="ui-monospace,Consolas,monospace">
    <rect x="60" y="230" width="160" height="100" rx="8" fill="#dfe6e4" stroke="#16232a" stroke-width="1.5"/>
    <text x="72" y="252" font-size="13" font-weight="700" fill="#16232a">D0</text>
