    <text x="208" y="304" text-anchor="end" font-size="11" fill="#16232a">62%</text>
    <rect x="72" y="308" width="136" height="10" fill="none" stroke="#16232a"/>
    <rect x="72" y="308" width="84" height="10" fill="#cc7a1f"/>
  </g>
  <g font-family="ui-monospace,Consolas,monospace">
    <rect x="340" y="230" width="160" height="100" rx="8" fill="#dfe6e4" stroke="#16232a" stroke-width="1.5"/>
    <text x="352" y="252" font-size="13" font-weight="700" fill="#16232a">D1</text>
    <line x1="352" y1="266" x2="488" y2="266" stroke="#55696c"/>
    <line x1="352" y1="278" x2="488" y2="278" stroke="#55696c"/>
    <line x1="352" y1="290" x2="488" y2="290" stroke="#55696c"/>
    <text x="488" y="304" text-anchor="end" font-size="11" fill="#16232a">55%</text>
    <rect x="352" y="308" width="136" height="10" fill="none" stroke="#16232a"/>
    <rect x="352" y="308" width="75" height="10" fill="#cc7a1f"/>
  </g>
  <g font-family="ui-monospace,Consolas,monospace">
    <rect x="620" y="230" width="160" height="100" rx="8" fill="#dfe6e4" stroke="#16232a" stroke-width="1.5"/>
    <text x="632" y="252" font-size="13" font-weight="700" fill="#16232a">D2</text>
    <line x1="632" y1="266" x2="768" y2="266" stroke="#55696c"/>
    <line x1="632" y1="278" x2="768" y2="278" stroke="#55696c"/>
    <line x1="632" y1="290" x2="768" y2="290" stroke="#55696c"/>
    <text x="768" y="304" text-anchor="end" font-size="11" fill="#16232a">58%</text>
    <rect x="632" y="308" width="136" height="10" fill="none" stroke="#16232a"/>
    <rect x="632" y="308" width="79" height="10" fill="#cc7a1f"/>
  </g>
  <g font-family="ui-monospace,Consolas,monospace">
    <rect x="900" y="230" width="160" height="100" rx="8" fill="#dfe6e4" stroke="#16232a" stroke-width="1.5"/>
    <text x="912" y="252" font-size="13" font-weight="700" fill="#16232a">D3</text>
    <line x1="912" y1="266" x2="1048" y2="266" stroke="#55696c"/>
    <line x1="912" y1="278" x2="1048" y2="278" stroke="#55696c"/>
    <line x1="912" y1="290" x2="1048" y2="290" stroke="#55696c"/>
    <text x="1048" y="304" text-anchor="end" font-size="11" fill="#16232a">60%</text>
    <rect x="912" y="308" width="136" height="10" fill="none" stroke="#16232a"/>
    <rect x="912" y="308" width="82" height="10" fill="#cc7a1f"/>
  </g>

  <text x="580" y="358" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#55696c">all four writes run at once — no lock held during device I/O</text>

  <text x="160" y="404" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#a8402f">1 DRIVE</text>
  <rect x="170" y="392" width="900" height="18" fill="#a8402f"/>
  <text x="1080" y="405" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#16232a">T</text>

  <text x="160" y="444" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#2569a6">4 DRIVES</text>
  <rect x="170" y="432" width="225" height="18" fill="#2569a6"/>
  <text x="405" y="445" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#16232a">~T⁄4 · ~4× faster</text>

  <text x="1120" y="486" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" fill="#16232a">01 — MULTI-DRIVE FAN-OUT</text>
  <text x="1120" y="502" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#55696c">sharded_ssd_tier.cpp · BatchWrite</text>
</svg>
