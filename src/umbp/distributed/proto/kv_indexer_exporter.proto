syntax = "proto3";

package mori.umbp.indexer;

import "sgl_kv_indexer.proto";

// Explicit logical-to-physical metadata. No storage-key format is assumed.
message ComponentObjects {
  // Exactly one of FULL=1, SWA=2, MAMBA=4.
  uint32 component = 1;
  // All of these committed objects must be present locally in DRAM.
  repeated string keys = 2;
}

message BlockMapping {
  sfixed64 hash = 1;
  // Absence denotes a root, as in the Indexer protocol.
  optional sfixed64 parent_hash = 2;
  uint32 block_size = 3;
  repeated ComponentObjects components = 4;
}

message ExporterConfig {
  // gRPC target, e.g. localhost:50051 (not an HTTP URL).
  string endpoint = 1;
  string worker_id = 2;
  string worker_address = 3;
  kv_indexer.v1.WorkerCacheSpec cache_spec = 4;
  repeated BlockMapping blocks = 5;
  // Zero selects the defaults: 1000 / 200 / 30000 milliseconds.
  uint32 poll_interval_ms = 6;
  uint32 rpc_timeout_ms = 7;
  uint32 full_sync_interval_ms = 8;
}
