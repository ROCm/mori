syntax = "proto3";
package umbp;

import "umbp.proto";

service UMBPStandalone {
  rpc Ping(Empty) returns (PingResponse);

  rpc Put(PutRequest) returns (BoolResponse);
  rpc Get(GetRequest) returns (BoolResponse);
  rpc BatchPut(BatchDataRequest) returns (BatchBoolResponse);
  rpc BatchPutRanges(BatchRangeDataRequest) returns (BatchBoolResponse);
  rpc BatchPutWithDepth(BatchDataWithDepthRequest) returns (BatchBoolResponse);
  rpc BatchGet(BatchDataRequest) returns (BatchBoolResponse);
  rpc BatchGetRanges(BatchRangeDataRequest) returns (BatchBoolResponse);
  rpc Exists(KeyRequest) returns (BoolResponse);
  rpc BatchExists(BatchKeysRequest) returns (BatchBoolResponse);
  rpc BatchExistsConsecutive(BatchKeysRequest) returns (CountResponse);

  rpc Clear(Empty) returns (BoolResponse);
  rpc Flush(Empty) returns (BoolResponse);
  rpc RegisterMemory(RegisterMemoryRequest) returns (BoolResponse);
  rpc DeregisterMemory(DeregisterMemoryRequest) returns (Empty);

  rpc ReportExternalKvBlocks(StandaloneExternalKvMutationRequest) returns (BoolResponse);
  rpc RevokeExternalKvBlocks(StandaloneExternalKvMutationRequest) returns (BoolResponse);
  rpc RevokeAllExternalKvBlocksAtTier(StandaloneExternalKvTierRequest) returns (BoolResponse);
  rpc MatchExternalKv(StandaloneMatchExternalKvRequest) returns (StandaloneMatchExternalKvResponse);
  rpc GetExternalKvHitCounts(StandaloneExternalKvHitCountsRequest)
      returns (StandaloneExternalKvHitCountsResponse);
}

message Empty {}

message PingResponse {
  bool ready = 1;
  StandaloneBackendMode deployment_mode = 2;
  bool supports_ranged_io = 3;
}

message BoolResponse {
  bool ok = 1;
  string error = 2;
}

enum StandaloneBackendMode {
  STANDALONE_BACKEND_UNKNOWN = 0;
  STANDALONE_BACKEND_LOCAL = 1;
  STANDALONE_BACKEND_DISTRIBUTED = 2;
}

message CountResponse {
  uint64 count = 1;
}

message KeyRequest {
  string key = 1;
}

message BatchKeysRequest {
  repeated string keys = 1;
}

message PutRequest {
  string key = 1;
  string client_id = 2;
  uint64 shm_offset = 3;
  uint64 size = 4;
  // Worker VA base of the region shm_offset is relative to (== the worker_base
  // sent at RegisterMemory). 0 means single-region / legacy first-fit.
  uint64 region_base = 5;
}

message GetRequest {
  string key = 1;
  string client_id = 2;
  uint64 shm_offset = 3;
  uint64 size = 4;
  uint64 region_base = 5;
}

message BatchDataRequest {
  repeated string keys = 1;
  string client_id = 2;
  repeated uint64 shm_offsets = 3;
  repeated uint64 sizes = 4;
  // Parallel to shm_offsets: region_bases[i] is the worker VA base of the
  // region shm_offsets[i] is relative to. Empty means single-region / legacy.
  repeated uint64 region_bases = 5;
}

message BatchRangeDataRequest {
  repeated string keys = 1;
  string client_id = 2;
  // The remaining fields are flattened over entries. range_counts[i] records
  // how many ranges belong to keys[i].
  repeated uint32 range_counts = 3;
  repeated uint64 shm_offsets = 4;
  repeated uint64 region_bases = 5;
  repeated uint64 sizes = 6;
  repeated uint64 object_offsets = 7;
  // Put only: the expected full object size, one per key. Empty for get.
  repeated uint64 object_sizes = 8;
  // Get only, optional. Non-zero key_handle names a key list the server minted
  // on an earlier call and still holds; `keys` is then empty. A layer-wise
  // reader asks about one set once per layer group, so this is the part of the
  // request worth not repeating.
  //
  // A hint and nothing more: a handle the server no longer holds is answered
  // with key_handle_unknown, and the caller repeats the call carrying its keys.
  // key_fingerprint is checked against the one recorded at mint, so a handle
  // can never bind to a list other than the one it was minted for.
  uint64 key_handle = 9;
  uint64 key_fingerprint = 10;
}

message BatchDataWithDepthRequest {
  repeated string keys = 1;
  string client_id = 2;
  repeated uint64 shm_offsets = 3;
  repeated uint64 sizes = 4;
  repeated int32 depths = 5;
  repeated uint64 region_bases = 6;
}

message BatchBoolResponse {
  repeated bool ok = 1;
  // BatchGetRanges only. Non-zero when the server minted a handle for this
  // call's key list; name it instead of the keys next time.
  uint64 key_handle = 2;
  // The offered key_handle is unknown, or does not match the offered
  // fingerprint. Nothing was read and `ok` is empty; repeat the call with keys.
  bool key_handle_unknown = 3;
}

enum MemoryKind {
  MEMORY_KIND_HOST_SHM = 0;
  MEMORY_KIND_GPU_IPC = 1;
}

message RegisterMemoryRequest {
  string client_id = 1;
  uint64 worker_base = 2;
  uint64 size = 3;
  string worker_node_id = 4;
  string worker_node_address = 5;
  repeated string tags = 6;
  MemoryKind kind = 7;
  int32 device_id = 8;
  bytes ipc_handle = 9;
  uint64 ipc_offset = 10;
  uint64 alloc_base = 11;
}

message DeregisterMemoryRequest {
  string client_id = 1;
}

message StandaloneExternalKvMutationRequest {
  repeated string hashes = 1;
  TierType tier = 2;
  string client_id = 3;
}

message StandaloneExternalKvTierRequest {
  TierType tier = 1;
  string client_id = 2;
}

message StandaloneMatchExternalKvRequest {
  repeated string hashes = 1;
  bool count_as_hit = 2;
  string client_id = 3;
}

message StandaloneExternalKvMatch {
  string node_id = 1;
  string peer_address = 2;
  repeated TierHashes hashes_by_tier = 3;
}

message StandaloneMatchExternalKvResponse {
  repeated StandaloneExternalKvMatch matches = 1;
}

message StandaloneExternalKvHitCountsRequest {
  repeated string hashes = 1;
  string client_id = 2;
}

message StandaloneExternalKvHitCountEntry {
  string hash = 1;
  uint64 hit_count_total = 2;
}

message StandaloneExternalKvHitCountsResponse {
  repeated StandaloneExternalKvHitCountEntry entries = 1;
}
