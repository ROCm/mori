# Contract for the gemm_ar_bf16_fused_opt case: take the gemm_ar_bf16 case's fused
# candidate and make it no slower than the existing GemmAllReduceOp, keeping its
# structure. Copy to <records>/<task>/contract.yaml for a run, fill in start_from.records;
# the owner approves it before step 1.

task: gemm_ar_bf16-fused-opt
kind: optimize
owner: <name>
revision: 1
approved: false

start_from:
  candidate: v2-fused
  commit: 1422e4b88        # branch xiangch/gemm-ar-bf16-eval-1: the gemm_ar_bf16 case's first run
  impl: mori.ops.gemm_ar_v2.op:GemmArV2Fused
  records: <the first run's task directory>   # design/v2-fused.md, runs/ep2, decisions.md, report.md
  measured_us: {16384: 1208.2, 8192: 653.8, 4096: 375.2}   # development runs; existing 1164.4 / 626.7 / 358.0
keep:
  - one GEMM launch per call, whose epilogue posts each (destination, chunk) from the block that completes it
  - BF16 on the wire; a reduce-scatter by row bands, then an all-gather
reference_access: blackbox

workload:
  op: gemm_ar
  model: a row-parallel BF16 linear layer followed by an all-reduce (wo_b's shape)
  parallel: {tp: 8}
  world_size: 8
  gpu: MI355X (gfx950), one node, xGMI
  shape: {n: 7168, k: 2048}
  dtype: {gemm: bf16, wire: bf16}
  m_sweep: [4096, 8192, 16384]
  target_buckets: [16384]
  deployment: graph
  held_out:
    m_range: [1, 16384]
    must_include: [1, an M that is not a multiple of 256]

interface: benchmark/cco/harness/cases/gemm_ar_bf16/interface.py

clean_room:
  hidden: benchmark/cco/harness/cases/gemm_ar_bf16/hidden_paths.txt
  settings: benchmark/cco/harness/cases/gemm_ar_bf16/settings.implementer.json
  audit: benchmark/cco/harness/cases/gemm_ar_bf16/audit.py
  blackbox: >-
    the existing op's kernel trace (op_harness.py --mode trace --impl existing): kernel
    names, starts and durations, and the phase times derived from them; never its source,
    ISA, IR or compiled code

baseline:
  reference: existing      # GemmAllReduceOp(quant="bf16") with its defaults, as op_harness.py --impl existing
  also_compare: [v2-stream (mori.ops.gemm_ar_v2.op:GemmArV2), the start candidate]

correctness:
  rule: rel_l2 <= tolerance against the fp32 sum over ranks, every rank, every case
  tolerance: 6.0e-3
  reference: op_harness.py (operands rebuilt on every rank, fp32 reference computed locally)
  suite: op_harness.py --mode check (held-out M, repeated calls, graph replay, rank skew, wrap when exposed)

protocol:
  timing: op_harness.py --mode time, through run.py --arms, interleaved, 3 rounds, --aa
  calls_per_graph: 1
  cache: hot
  deviations: []

targets:
  reference: existing
  within_pct: 0            # candidate median <= existing median at M=16384, same launch
  no_regression: [8192, 4096]

budget:
  rounds: 6
  gpu_hours: 12
  stop_after_flat_rounds: 2

environment:
  image: <tag>
  rocm: <version>
  torch: <version>
  flydsl: <version>
  mori: <commit>
  launcher: ""
