# The development comparison of the fused-opt case: the candidate against the existing op
# (the reference) and the v2-stream candidate, all through gemm_ar_bf16's op_harness.py.
#
#   CANDIDATE=mori.ops.gemm_ar_v2.op:GemmArV2Fused python benchmark/cco/harness/run.py \
#       --arms <this file> --baseline existing --aa --bench-args "-m 16384" --out <run-dir>
arms:
  - name: existing
    bench: benchmark/cco/harness/cases/gemm_ar_bf16/op_harness.py
    args: --mode time --impl existing
  - name: candidate
    bench: benchmark/cco/harness/cases/gemm_ar_bf16/op_harness.py
    args: --mode time --impl ${CANDIDATE}
  - name: stream
    bench: benchmark/cco/harness/cases/gemm_ar_bf16/op_harness.py
    args: --mode time --impl mori.ops.gemm_ar_v2.op:GemmArV2
